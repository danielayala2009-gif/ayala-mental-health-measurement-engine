name: Install PWA icon assets
on:
  push:
    paths:
      - '.github/workflows/install-pwa-icon.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cairosvg
      - name: Integrate Simulation Lab into main workspace
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg, json
          svg=Path('icon.svg').read_bytes()
          cairosvg.svg2png(bytestring=svg,write_to='icon-192.png',output_width=192,output_height=192)
          cairosvg.svg2png(bytestring=svg,write_to='icon-512.png',output_width=512,output_height=512)
          p=Path('index.html'); s=p.read_text()
          marker='<title>Ayala Mental Health Measurement Engine</title>'
          links=marker+'<link rel="manifest" href="./manifest.webmanifest?v=3"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=3"><link rel="apple-touch-icon" href="./icon-192.png?v=3"><meta name="theme-color" content="#0b3150">'
          if 'rel="manifest"' not in s: s=s.replace(marker,links,1)
          # Add Simulation Lab as a first-class main navigation tab.
          if 'data-tab="simulation"' not in s:
              anchor='<button type="button" data-tab="evidence">Evidence & Rights</button>'
              s=s.replace(anchor,anchor+'<button type="button" data-tab="simulation">🧪 Simulation Lab</button>',1)
          # Add integrated panel before the copyright guardrail.
          if 'id="simulation"' not in s:
              panel='''<section id="simulation" class="panel"><h2>🧪 Simulation Lab</h2><div class="notice good"><b>Synthetic QA environment:</b> FP records are fake participants used only to validate storage, scoring, exports, and analysis plumbing. FP and NP records are excluded from experimental analysis by design.</div><div id="simStats" class="stats"></div><div class="card"><h3>Create Fake Participant</h3><div class="controls"><button type="button" class="primary simProfile" data-profile="low">FP Low-pattern</button><button type="button" class="simProfile" data-profile="mixed">FP Mixed-pattern</button><button type="button" class="simProfile" data-profile="high">FP High-pattern</button><button type="button" id="simRandomMain">FP Random stress-test</button></div><p class="small">These are synthetic test cases, never human observations or clinical evidence.</p></div><div class="card"><h3>FP Test Bank</h3><div id="simRowsMain"></div></div><div class="card"><h3>Simulation Data Controls</h3><div class="controls"><button type="button" id="simExportMain">Export FP JSON</button><button type="button" id="simAuditMain">Export Audit Log</button><button type="button" id="simClearMain">Clear FP/NP Test Banks</button></div></div></section>'''
              s=s.replace('<div class="notice"><b>Copyright guardrail:',panel+'<div class="notice"><b>Copyright guardrail:',1)
          # Load data layer and integrated controller; remove old floating controller.
          s=s.replace('<script src="./data/simulation_lab.js?v=100rc2"></script>','')
          if './data/research_mode.js' not in s: s=s.replace('</body>','<script src="./data/research_mode.js?v=100rc4"></script></body>',1)
          if './data/simulation_integrated.js' not in s: s=s.replace('</body>','<script src="./data/simulation_integrated.js?v=100rc4"></script></body>',1)
          s=s.replace('v0.9.0','v1.0.0-rc1')
          p.write_text(s)
          manifest={'name':'Ayala Mental Health Measurement Engine','short_name':'Ayala MH','description':'Unified participant, researcher, and synthetic simulation research workspace.','id':'./','start_url':'./?source=pwa&v=100rc4','scope':'./','display':'standalone','background_color':'#06142d','theme_color':'#0b3150','icons':[{'src':'./icon-192.png','sizes':'192x192','type':'image/png','purpose':'any maskable'},{'src':'./icon-512.png','sizes':'512x512','type':'image/png','purpose':'any maskable'}]}
          Path('manifest.webmanifest').write_text(json.dumps(manifest,separators=(',',':')))
          Path('sw.js').write_text("const C='ayala-mh-v6';self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(clients.claim()));self.addEventListener('fetch',()=>{});")
          PY
      - name: Commit integrated workspace
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.webmanifest sw.js icon-192.png icon-512.png
          git commit -m 'Integrate Simulation Lab into main workspace' || exit 0
          git push
